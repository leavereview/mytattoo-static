name: Deploy to Server

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth-1 clone: sitemap <lastmod> comes from each
      # page's last git commit (../scripts/sitemap-lastmod.mjs). In a shallow clone every
      # page reports the HEAD commit date — the DriveSchoolPro bug. (This workflow is
      # disabled; deploys go through deploy.sh. Kept correct in case it is re-enabled.)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ubuntu
          SOURCE: dist/
          TARGET: /var/www/mytattoo.software/
          ARGS: "-rltDvz --delete"
